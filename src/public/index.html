<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Bookeeper · 车辆记账与看板</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login" class="login hidden">
      <form class="login-card" id="login-form">
        <div class="login-brand">
          <span class="logo">B</span>
          <div>
            <h1>Bookeeper</h1>
            <p>泵车 / 搅拌车 记账与看板</p>
          </div>
        </div>
        <label class="field">
          <span>访问密码</span>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入访问密码" required />
        </label>
        <p class="login-error" id="login-error"></p>
        <button class="btn btn-primary btn-block" type="submit">进入</button>
      </form>
    </div>

    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="brand">
          <span class="logo">B</span>
          <span class="brand-name">Bookeeper</span>
        </div>
        <nav class="tabs" id="tabs">
          <button class="tab is-active" data-tab="board">看板</button>
          <button class="tab" data-tab="entry">录入</button>
          <button class="tab" data-tab="config">配置</button>
        </nav>
        <div class="topbar-actions">
          <span class="today" id="today-label"></span>
          <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">退出</button>
        </div>
      </header>

      <main class="main">
        <section class="view" id="view-board"></section>
        <section class="view hidden" id="view-entry"></section>
        <section class="view hidden" id="view-config"></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
