name: bookeeper

services:
  mysql:
    image: mysql:8.0.35
    container_name: bookeeper-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookeeper}
      MYSQL_USER: ${MYSQL_USER:-bookeeper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bookeeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookeeper:app-v2
    container_name: bookeeper
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3000"
      TZ: Asia/Shanghai
      TIME_ZONE: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-bookeeper}
      DB_USER: ${MYSQL_USER:-bookeeper}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # 拍照识别（阿里云百炼 DashScope）；不配则「拍照」页不可用
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_VL_MODEL: ${DASHSCOPE_VL_MODEL:-qwen3-vl-plus}
      # 台账照片归档目录（容器内），按 YYYY-MM-DD 分目录
      PHOTO_DIR: /data/photos
    expose:
      - "3000"
    volumes:
      - photos:/data/photos
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    name: bookeeper-internal
  web:
    external: true
    name: web

volumes:
  mysql-data:
    name: bookeeper-mysql-data
  photos:
    name: bookeeper-photos
